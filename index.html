<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado Enfermagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1> Almoxarifado de Enfermagem</h1>
        <p class="subtitle">Controle de Materiais Médicos</p>
        
        <section class="form-section">
            <h2>Cadastrar Novo Material</h2>
            
            <div class="form-group">
                <label for="input-nome">Descrição do Material (Nome/Especificação):</label>
                <input type="text" id="input-nome" placeholder="Ex: Seringa Descartável 5ml c/ Agulha">
            </div>
            
            <div class="form-group">
                <label for="input-quantidade">Quantidade em Estoque (Unidades):</label>
                <input type="number" id="input-quantidade" placeholder="Ex: 150">
            </div>
            
            <button id="btn-cadastrar">Cadastrar no Estoque</button>
        </section>

        <section class="list-section">
            <h2>Inventário de Materiais Disponíveis</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Cód. Sistema</th>
                        <th>Descrição do Insumo Médico</th>
                        <th>Qtd. Disponível</th>
                    </tr>
                </thead>
                <tbody id="lista-materiais">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
